name: Cocina — publicar datos en R2

# Extrae las fuentes oficiales, valida, construye los Parquet y los publica en
# Cloudflare R2. Corre solo cada lunes y también se puede lanzar a mano.
# Si un dataset falla, los demás se publican igual y el workflow termina en
# rojo: GitHub te avisa por correo.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Solo estos datasets, separados por espacios (vacío = todos)"
        required: false
        default: ""
  schedule:
    - cron: "0 8 * * 1"  # lunes 03:00 hora de Lima (08:00 UTC)

permissions:
  contents: read

concurrency:
  group: etl
  cancel-in-progress: false

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -e ".[pipeline]"
      - name: Cocinar (extraer + validar + Parquet)
        run: |
          if [ -n "${{ inputs.only }}" ]; then
            python -m pipelines build --only ${{ inputs.only }} || true
          else
            python -m pipelines build || true
          fi
          # Un dataset fallido no bloquea a los demás: conserva su versión anterior.
          python -c "import json;c=json.load(open('data/normalized/catalog.json'));print('Fallidos:',c['failed'] or 'ninguno')"
      - name: Publicar en la vitrina (R2)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET || 'peruopen-data' }}
        run: python -m pipelines publish --target r2
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: catalog
          path: data/normalized/catalog.json
      - name: Avisar si algún dataset falló
        run: |
          python - <<'EOF'
          import json, sys
          failed = json.load(open("data/normalized/catalog.json"))["failed"]
          if failed:
              for name, error in failed.items():
                  print(f"::error title={name}::{error}")
              sys.exit(1)
          print("Todos los datasets se actualizaron bien")
          EOF
