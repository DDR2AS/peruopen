name: Publicar en PyPI

# Se dispara al subir un tag de versión (p. ej. v0.1.0a1). Usa Trusted
# Publishing (OIDC): no hay tokens de PyPI guardados en el repo.
#
# Configuración única en pypi.org → Account settings → Publishing → Add a new
# pending publisher: project "peruopen", owner "DDR2AS", repository "peruopen",
# workflow "publish.yml", environment "pypi".
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: El tag debe coincidir con la versión de pyproject.toml
        run: |
          version=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "El tag ${GITHUB_REF_NAME} no coincide con la versión ${version} de pyproject.toml" >&2
            exit 1
          fi
      - run: pip install -e ".[pipeline,mcp]" pytest build twine
      - run: pytest -q
      - run: python -m build
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/peruopen/
    permissions:
      id-token: write  # necesario para Trusted Publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
