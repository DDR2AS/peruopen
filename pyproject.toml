[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "peruopen"
version = "0.1.0a1"
description = "Datos públicos oficiales del Perú (SUNAT, BCRP, INEI, MEF), curados en Parquet y consultables con DuckDB y MCP."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Diego Avila" }]
keywords = ["peru", "open-data", "datos-abiertos", "duckdb", "parquet", "mcp", "sunat", "bcrp", "ubigeo"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Natural Language :: Spanish",
    "Operating System :: OS Independent",
]
# Instalación base: solo lo necesario para LEER los datos ya publicados.
dependencies = [
    "duckdb>=1.1,<2",
    "pyarrow>=17",
    "httpx>=0.27,<1",
    "platformdirs>=4.3,<5",
]

[project.optional-dependencies]
polars = ["polars>=1.9,<2"]
pandas = ["pandas>=2.2,<3"]
mcp = ["fastmcp>=2.3,<3"]
# Dependencias del ETL (la cocina). Nunca las importa src/peruopen/.
pipeline = [
    "boto3>=1.34,<2",
]

[project.scripts]
peruopen-mcp = "peruopen.mcp_server:main"

[project.urls]
Homepage = "https://github.com/DDR2AS/peruopen"
Repository = "https://github.com/DDR2AS/peruopen"
Issues = "https://github.com/DDR2AS/peruopen/issues"
Documentation = "https://github.com/DDR2AS/peruopen/tree/main/docs"

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.7,<1",
    "mypy>=1.13,<2",
    "fastmcp>=2.3,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/peruopen"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"spikes/*" = ["E501"]  # scripts desechables de la Fase 0

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-ra --strict-markers"
markers = ["network: hace peticiones reales a fuentes oficiales (se omiten por defecto)"]
filterwarnings = [
    "ignore:authlib.jose module is deprecated",
    "ignore:The httpx module is deprecated",
]
